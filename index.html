<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Keeps the page clean, no scrollbars */
            text-align: center;
        }

        #container {
            background: white;
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 90%;
            position: relative; /* Helps contain absolute elements if needed */
        }

        h1 {
            color: #d02a52;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .gif-container img {
            width: 100%;
            max-width: 230px; /* Responsive image sizing */
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            min-height: 50px; /* Prevents layout shift */
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent; /* Removes mobile tap highlight */
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncier transition */
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .celebrate-text {
            color: #d02a52;
            font-size: 2.2rem;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="askState">
            <div class="gif-container">
                <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3BwYmR3eW14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PWEmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Puppy Eyes">
            </div>
            <h1 id="question">Will you be my Valentine, Coco?</h1>
            <div class="buttons">
                <button id="yesBtn">Yes! ❤️</button>
                <button id="noBtn">No 💔</button>
            </div>
        </div>

        <div id="celebrateState" style="display: none;">
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3BwYmR3eW14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PWEmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/artj92cXEV9xe/giphy.gif" alt="Celebration">
            </div>
            <h1 class="celebrate-text">Yay! Best Valentine ever! 🥰</h1>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const askState = document.getElementById('askState');
        const celebrateState = document.getElementById('celebrateState');
        const mainGif = document.getElementById('mainGif');

        let messageIndex = 0;
        let yesSize = 1;

        const messages = [
            "Are you sure??",
            "What if I gift you a diet coke?",
            "Pretty please",
            "With a packet of spicy ramen",
            "What about a date at ghumi ghumi options?",
            "PLEASE POOKIE",
            "But :*(",
            "I am going to die",
            "Yep im dead",
            "Ok ur talking to Aditya's ghost"
        ];

        // LOGIC IMPROVEMENT 1: Safe bounds for the button jump
        const moveButton = () => {
            // Buffer to keep button away from absolute edges (20px)
            const padding = 20; 
            
            // Calculate available space
            const maxWidth = window.innerWidth - noBtn.offsetWidth - padding;
            const maxHeight = window.innerHeight - noBtn.offsetHeight - padding;

            // Ensure we don't get negative values
            const x = Math.max(padding, Math.random() * maxWidth);
            const y = Math.max(padding, Math.random() * maxHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        };

        noBtn.addEventListener('click', () => {
            if (messageIndex < messages.length) {
                noBtn.innerText = messages[messageIndex];
                messageIndex++;

                // LOGIC IMPROVEMENT 2: Cap the size growth at 3x
                if (yesSize < 3) {
                    yesSize += 0.2;
                    yesBtn.style.transform = `scale(${yesSize})`;
                }
                
                if(messageIndex === 5) {
                    mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3BwYmR3eW14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PWEmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/OPU6wzx8JBaK6SgSGo/giphy.gif";
                }
            } else {
                moveButton();
            }
        });

        // Handle both mouse and touch interactions for the "run away" effect
        ['mouseover', 'touchstart'].forEach(eventType => {
            noBtn.addEventListener(eventType, (e) => {
                if (messageIndex >= messages.length) {
                    // Prevent default touch behavior (scrolling/zooming) only on the button
                    if(e.type === 'touchstart') e.preventDefault();
                    moveButton();
                }
            });
        });

        yesBtn.addEventListener('click', () => {
            askState.style.display = 'none';
            celebrateState.style.display = 'block';
            createConfetti();
        });

        function createConfetti() {
            // LOGIC IMPROVEMENT 3: Cleaner confetti loop
            for(let i=0; i<70; i++) {
                const confetti = document.createElement('div');
                confetti.innerText = Math.random() > 0.5 ? '❤️' : '🌸';
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-5vh';
                // Randomize fall duration and delay for more natural effect
                confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                confetti.style.animationDelay = `${Math.random() * 2}s`; 
                confetti.style.fontSize = Math.random() * 20 + 15 + 'px';
                confetti.style.zIndex = '1000'; // Ensure confetti falls ON TOP of everything
                confetti.style.pointerEvents = 'none'; // Click through confetti
                document.body.appendChild(confetti);
                
                // Cleanup after animation
                setTimeout(() => confetti.remove(), 6000);
            }
        }
    </script>
</body>
              </html>
