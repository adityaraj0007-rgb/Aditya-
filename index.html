<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift for Frank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            transition: background-color 0.5s ease;
        }

        /* The Blackout State */
        body.blackout {
            background-color: black !important;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
            transition: opacity 0.5s;
        }

        .gift-container {
            cursor: pointer;
            font-size: 80px;
            user-select: none;
            position: relative;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Added smooth transition for the "dodging" movement */
            transition: transform 0.1s ease-out; 
        }

        .cat {
            font-size: 60px;
            position: absolute;
            bottom: 0;
            opacity: 0;
            transform: translateY(20px);
            transition: filter 1.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            filter: brightness(2) grayscale(1); 
        }

        .reveal .cat {
            opacity: 1;
            transform: translateY(-70px);
        }

        .cat.turn-black {
            filter: brightness(0) grayscale(1);
        }

        .instruction {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #666;
            font-weight: 500;
        }

        #prank-message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.3rem;
            color: #d9534f;
            display: none;
            max-width: 80%;
        }

        /* Final Bank Message */
        #bank-msg {
            display: none;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            z-index: 100;
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
            color: #888;
        }
    </style>
</head>
<body id="mainBody">

    <h1 id="header-text"><b>Here is your gift</b></h1>

    <div class="gift-container" id="giftBox" onclick="handleInteraction()">
        <span class="cat" id="catEmoji">🐱</span>
        <span id="boxEmoji">🎁</span>
    </div>

    <p class="instruction" id="sub-text">Plzz claim</p>

    <div id="prank-message">
        Got you 😼<br>kat gaya aapka link pe aa kar meethe
    </div>

    <div id="bank-msg">check your bank account ✌️</div>

    <footer id="footer">
        Designed by me ofcourse — Aditya
    </footer>

    <script>
        let clickCount = 0;
        const maxDodges = 10;

        function handleInteraction() {
            const container = document.getElementById('giftBox');
            
            if (clickCount < maxDodges) {
                // 1. Dodge Logic: Move the box to a random nearby position
                const randomX = (Math.random() - 0.5) * 200; // moves left or right
                const randomY = (Math.random() - 0.5) * 200; // moves up or down
                container.style.transform = `translate(${randomX}px, ${randomY}px)`;
                clickCount++;
            } else {
                // 2. Success Logic: Reset position and reveal
                container.style.transform = `translate(0, 0)`;
                container.onclick = null; 
                revealGift();
            }
        }

        function revealGift() {
            const container = document.getElementById('giftBox');
            const cat = document.getElementById('catEmoji');
            const prankMsg = document.getElementById('prank-message');
            const subText = document.getElementById('sub-text');
            const body = document.getElementById('mainBody');
            const header = document.getElementById('header-text');
            const footer = document.getElementById('footer');
            const bankMsg = document.getElementById('bank-msg');

            container.classList.add('reveal');
            
            setTimeout(() => {
                // Change cat to black
                cat.classList.add('turn-black');
                prankMsg.style.display = 'block';
                subText.style.display = 'none';

                // 3. Final Sequence: Blackout and Bank Message
                setTimeout(() => {
                    // Fade out everything
                    container.style.display = 'none';
                    prankMsg.style.display = 'none';
                    header.style.display = 'none';
                    footer.style.display = 'none';
                    
                    // Trigger Blackout
                    body.classList.add('blackout');
                    
                    // Show final text
                    bankMsg.style.display = 'block';
                }, 3000); // Wait 3 seconds after the cat turns black

            }, 1500);
        }
    </script>
</body>
</html>
