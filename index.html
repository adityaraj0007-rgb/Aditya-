<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for Bahena! 🎁</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fce4ec; /* Soft Pink */
            --accent-pink: #ff80ab;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Confetti Animation */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ffd1dc;
            top: -10px;
            z-index: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); }
        }

        /* UI Elements */
        h2 {
            color: #880e4f;
            margin-bottom: 20px;
            z-index: 10;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gift-box {
            font-size: 80px;
            cursor: pointer;
            transition: all 0.3s ease-out;
            user-select: none;
            z-index: 20;
            display: inline-block;
        }

        .wiggle {
            animation: wiggle 0.4s ease-in-out;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(15deg) scale(1.1); }
            75% { transform: rotate(-15deg) scale(1.1); }
        }

        /* Final Surprise Overlay */
        #surprise {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(252, 228, 236, 0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .cat-img { font-size: 100px; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cake-img { font-size: 60px; margin-top: 10px; }
        
        .main-wish {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #ad1457;
            margin: 20px 0;
            opacity: 0;
        }

        .party-demand {
            font-size: 1.5rem;
            color: #d81b60;
            font-weight: bold;
            display: none;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        .fade-in { animation: fadeIn 1s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <h2 id="instruction">Click to Open Your Surprise!</h2>

    <div id="game-container">
        <div id="gift-box" onclick="tryOpen()">🎁</div>
    </div>

    <div id="surprise">
        <div class="cat-img">🐱✨</div>
        <div class="cake-img">🎂</div>
        <h1 class="main-wish" id="wishText">Happy Birthday to my dearest pyari se choti se bahena 💖</h1>
        <p class="party-demand" id="partyText">Where is my party? 🥳</p>
    </div>

    <audio id="popSound" src="https://www.myinstants.com/media/sounds/pop.mp3"></audio>

    <script>
        let dodgeCount = 0;
        const maxDodges = 5;
        const gift = document.getElementById('gift-box');
        const surprise = document.getElementById('surprise');
        const popSound = document.getElementById('popSound');

        // Confetti Generator
        for (let i = 0; i < 50; i++) {
            let confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = ['#ffc107', '#ff4081', '#00bcd4', '#8bc34a'][Math.floor(Math.random() * 4)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.delay = Math.random() * 5 + 's';
            document.body.appendChild(confetti);
        }

        // Dodge Logic
        gift.addEventListener('mouseover', () => {
            if (dodgeCount < maxDodges) {
                moveGift();
                dodgeCount++;
            }
        });

        function moveGift() {
            const container = document.getElementById('game-container');
            const maxX = container.clientWidth - 100;
            const maxY = container.clientHeight - 100;
            
            const randomX = Math.random() * maxX - (maxX/2);
            const randomY = Math.random() * maxY - (maxY/2);

            gift.style.transform = `translate(${randomX}px, ${randomY}px)`;
            gift.classList.add('wiggle');
            setTimeout(() => gift.classList.remove('wiggle'), 400);
        }

        function tryOpen() {
            if (dodgeCount >= maxDodges) {
                // Success
                popSound.play().catch(() => {}); // Catch if browser blocks audio
                gift.innerHTML = "💥";
                setTimeout(() => {
                    surprise.style.display = 'flex';
                    document.getElementById('wishText').classList.add('fade-in');
                    
                    setTimeout(() => {
                        const party = document.getElementById('partyText');
                        party.style.display = 'block';
                        party.classList.add('fade-in');
                    }, 2500);
                }, 300);
            }
        }
    </script>
</body>
</html>
