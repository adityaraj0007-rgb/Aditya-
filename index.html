<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift for Frank</title>
    <style>
        /* Modern, clean reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        /* Top Header */
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        /* Gift Box Styling */
        .gift-container {
            cursor: pointer;
            transition: transform 0.3s ease;
            font-size: 80px;
            user-select: none;
            position: relative;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-container:hover {
            transform: scale(1.1) rotate(5deg);
        }

        /* The Cat - Initially hidden inside/behind the box */
        .cat {
            font-size: 60px;
            position: absolute;
            bottom: 0;
            opacity: 0;
            transform: translateY(20px);
            transition: filter 1.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            /* Using brightness/grayscale to shift white to black */
            filter: brightness(2) grayscale(1); 
        }

        /* State when cat pops out */
        .reveal .cat {
            opacity: 1;
            transform: translateY(-70px);
        }

        /* Final black cat state triggered by JS */
        .cat.turn-black {
            filter: brightness(0) grayscale(1);
        }

        /* Instruction Text */
        .instruction {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #666;
            font-weight: 500;
        }

        /* Prank Message */
        #prank-message {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.3rem;
            color: #d9534f;
            display: none; /* Hidden until clicked */
            max-width: 80%;
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            opacity: 0.6;
            color: #888;
        }

        /* Animation for the pop */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <h1 id="header-text"><b>Here is your gift</b></h1>

    <div class="gift-container" id="giftBox" onclick="revealGift()">
        <span class="cat" id="catEmoji">🐱</span>
        <span id="boxEmoji">🎁</span>
    </div>

    <p class="instruction" id="sub-text">Plzz claim</p>

    <div id="prank-message">
        Got you 😼<br>kat gaya aapka link pe aa kar meethe
    </div>

    <footer>
        Designed by me ofcourse — Aditya
    </footer>

    <script>
        function revealGift() {
            const container = document.getElementById('giftBox');
            const cat = document.getElementById('catEmoji');
            const box = document.getElementById('boxEmoji');
            const prankMsg = document.getElementById('prank-message');
            const subText = document.getElementById('sub-text');

            // 1. Prevent multiple clicks
            container.onclick = null; 
            container.style.cursor = "default";

            // 2. Animate Cat Popping Out
            container.classList.add('reveal');
            
            // 3. Smooth transition to black after 1.5 seconds
            setTimeout(() => {
                cat.classList.add('turn-black');
                
                // 4. Display the prank text
                prankMsg.style.display = 'block';
                subText.style.display = 'none'; // Hide the "claim" text
            }, 1500);
        }
    </script>
</body>
</html>
