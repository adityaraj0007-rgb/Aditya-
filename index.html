<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift for Frank</title>
    <style>
        /* Base Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica', 'Arial', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            transition: background-color 0.1s ease; /* Fast snap */
        }

        /* The Kill-Switch State */
        body.terminal-state {
            background-color: #000 !important;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        .gift-container {
            cursor: pointer;
            font-size: 80px;
            user-select: none;
            position: relative;
            height: 150px;
            width: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 10;
        }

        .cat {
            font-size: 70px;
            position: absolute;
            bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: filter 1.5s ease, transform 0.5s ease, opacity 0.3s;
            filter: brightness(2) grayscale(1); 
        }

        /* Cat Reveal */
        .reveal .cat {
            opacity: 1;
            transform: translateY(-85px);
        }

        .cat.turn-black {
            filter: brightness(0) grayscale(1);
        }

        .instruction {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #666;
            height: 24px;
        }

        #prank-message {
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.4rem;
            color: #d9534f;
            display: none;
        }

        /* The Serious Final Message */
        #final-warning {
            display: none;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            z-index: 999;
            padding: 20px;
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.75rem;
            opacity: 0.5;
            color: #888;
        }
    </style>
</head>
<body id="mainBody">

    <div id="ui-wrapper">
        <h1 id="header-text"><b>Here is your gift</b></h1>

        <div class="gift-container" id="giftBox" onclick="handleDodge()">
            <span class="cat" id="catEmoji">🐱</span>
            <span id="boxEmoji">🎁</span>
        </div>

        <p class="instruction" id="sub-text">Plzz claim</p>

        <div id="prank-message">
            Got you 😼<br>kat gaya aapka link pe aa kar meethe
        </div>
    </div>

    <div id="final-warning">CHECK YOUR BANK ACCOUNT MORON.</div>

    <footer id="footer">
        Designed by me ofcourse — Aditya
    </footer>

    <script>
        let dodgeCount = 0;
        const requiredDodges = 5;

        function handleDodge() {
            const container = document.getElementById('giftBox');
            const subText = document.getElementById('sub-text');
            
            if (dodgeCount < requiredDodges) {
                // Violent movement
                const x = (Math.random() - 0.5) * 400;
                const y = (Math.random() - 0.5) * 400;
                
                container.style.transform = `translate(${x}px, ${y}px)`;
                subText.innerText = "You can't";
                subText.style.color = "#000";
                subText.style.fontWeight = "bold";
                
                dodgeCount++;
            } else {
                // Reset and Trigger Reveal
                container.style.transform = `translate(0, 0)`;
                container.onclick = null;
                subText.innerText = "";
                executePrank();
            }
        }

        function executePrank() {
            const container = document.getElementById('giftBox');
            const cat = document.getElementById('catEmoji');
            const prankMsg = document.getElementById('prank-message');
            const body = document.getElementById('mainBody');
            const uiWrapper = document.getElementById('ui-wrapper');
            const footer = document.getElementById('footer');
            const finalWarning = document.getElementById('final-warning');

            // 1. Cat pops
            container.classList.add('reveal');
            
            setTimeout(() => {
                // 2. Cat turns black & show first insult
                cat.classList.add('turn-black');
                prankMsg.style.display = 'block';

                // 3. The Sudden Blackout Sequence
                setTimeout(() => {
                    // Blank everything instantly
                    uiWrapper.style.display = 'none';
                    footer.style.display = 'none';
                    
                    // Snap to black
                    body.classList.add('terminal-state');
                    
                    // Show serious warning
                    finalWarning.style.display = 'block';
                }, 3000); 

            }, 1500);
        }
    </script>
</body>
</html>
