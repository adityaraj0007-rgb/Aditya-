<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift for Frank</title>
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* Bold Header */
        h1 {
            font-size: 2.2rem;
            color: #1a202c;
            margin-bottom: 30px;
            transition: opacity 0.5s;
        }

        /* Gift Box & Cat Container */
        .gift-wrapper {
            position: relative;
            cursor: pointer;
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease-in-out;
        }

        .gift-wrapper:hover {
            transform: scale(1.1);
        }

        #boxEmoji {
            font-size: 100px;
            z-index: 2;
            position: relative;
        }

        /* Cat Pop-out Logic */
        .cat {
            font-size: 70px;
            position: absolute;
            bottom: 20px;
            opacity: 0;
            z-index: 1;
            /* Starts white-ish */
            filter: brightness(2) grayscale(1);
            transition: 
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                opacity 0.3s ease,
                filter 1.5s ease; /* Smooth color shift */
        }

        /* Revealed State */
        .revealed .cat {
            opacity: 1;
            transform: translateY(-90px);
        }

        /* Black Cat State */
        .cat.black {
            filter: brightness(0) grayscale(1);
        }

        /* Sub-text */
        .sub-text {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #4a5568;
            font-weight: 500;
        }

        /* Prank Messages */
        .prank-container {
            margin-top: 25px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .main-prank {
            font-weight: bold;
            font-size: 1.4rem;
            color: #e53e3e;
        }

        .bank-alert {
            font-weight: bold;
            font-size: 1.1rem;
            color: #2d3748;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Footer */
        footer {
            position: fixed;
            bottom: 20px;
            font-size: 0.75rem;
            opacity: 0.5;
            color: #718096;
        }
    </style>
</head>
<body>

    <h1 id="header"><b>Here is your gift</b></h1>

    <div class="gift-wrapper" id="giftTrigger" onclick="startPrank()">
        <span class="cat" id="cat">🐱</span>
        <span id="boxEmoji">🎁</span>
    </div>

    <p class="sub-text" id="instruction">Plzz claim</p>

    <div class="prank-container" id="prankSection">
        <p class="main-prank">Got you 😼<br>kat gaya aapka link pe aa kar meethe</p>
        <p class="bank-alert" id="bankAlert">P.S. check your bank account 😉</p>
    </div>

    <footer>
        Designed by me ofcourse — Aditya
    </footer>

    <script>
        function startPrank() {
            const wrapper = document.getElementById('giftTrigger');
            const cat = document.getElementById('cat');
            const prankSection = document.getElementById('prankSection');
            const instruction = document.getElementById('instruction');
            const bankAlert = document.getElementById('bankAlert');

            // Disable further clicks
            wrapper.onclick = null;
            wrapper.style.cursor = "default";

            // 1. Pop the cat
            wrapper.classList.add('revealed');
            instruction.style.display = 'none';

            // 2. Wait 1.5s to turn black and show first message
            setTimeout(() => {
                cat.classList.add('black');
                prankSection.style.display = 'flex';
                
                // 3. Final "Bank Account" hit after a small delay
                setTimeout(() => {
                    bankAlert.style.opacity = '1';
                }, 1000);

            }, 1500);
        }
    </script>
</body>
</html>
