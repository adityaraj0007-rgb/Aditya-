<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            text-align: center;
        }

        #container {
            background: white;
            padding: 2rem;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 90%;
            width: 350px; /* Fixed width for better layout stability */
            position: relative;
        }

        h1 {
            color: #d02a52;
            font-size: 1.5rem;
            margin: 10px 0 20px 0;
            line-height: 1.3;
        }

        /* The new message area between sticker and title */
        #extraMessage {
            color: #ff6b6b;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 1.5em; /* Keeps space even when empty */
            margin-top: 10px;
            margin-bottom: 5px;
            transition: opacity 0.3s ease;
        }

        .gif-container img {
            width: 100%;
            max-width: 200px;
            border-radius: 15px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            min-height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            /* Constant size */
            width: 100px; 
            transition: background-color 0.2s;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
        }

        /* Celebration styles */
        .celebrate-text {
            color: #d02a52;
            font-size: 2rem;
            margin-top: 20px;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="askState">
            <div class="gif-container">
                <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3BwYmR3eW14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PWEmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Puppy Eyes">
            </div>
            
            <div id="extraMessage"></div>

            <h1 id="question">Will you be my Valentine, Coco?</h1>
            
            <div class="buttons">
                <button id="yesBtn">Yes! ❤️</button>
                <button id="noBtn">No 💔</button>
            </div>
        </div>

        <div id="celebrateState" style="display: none;">
            <div class="gif-container">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3BwYmR3eW14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PWEmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/artj92cXEV9xe/giphy.gif" alt="Celebration">
            </div>
            <h1 class="celebrate-text">Yay! Best Valentine ever! 🥰</h1>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const askState = document.getElementById('askState');
        const celebrateState = document.getElementById('celebrateState');
        const mainGif = document.getElementById('mainGif');
        const extraMessage = document.getElementById('extraMessage');

        let messageIndex = 0;
        
        // Your custom messages list
        const messages = [
            "Are you sure??",
            "Think again!",
            "I will give you a bucket of chocolate! 🍫",
            "And lots of ice cream! 🍦",
            "Pretty please?",
            "I can't stay without you so please... 🥺"
        ];

        // Move button logic (only called at the end)
        const moveButton = () => {
            const padding = 20; 
            const maxWidth = window.innerWidth - noBtn.offsetWidth - padding;
            const maxHeight = window.innerHeight - noBtn.offsetHeight - padding;

            const x = Math.max(padding, Math.random() * maxWidth);
            const y = Math.max(padding, Math.random() * maxHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        };

        noBtn.addEventListener('click', () => {
            // If there are still messages left, show them
            if (messageIndex < messages.length) {
                extraMessage.innerText = messages[messageIndex];
                messageIndex++;
                
                // Change GIF on the last plea
                if(messageIndex === messages.length) {
                    mainGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXByZ3BwYmR3eW14eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PWEmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/OPU6wzx8JBaK6SgSGo/giphy.gif";
                }
            } else {
                // All messages shown, NOW start jumping
                moveButton();
            }
        });

        // Add run-away behavior ONLY after all messages are shown
        ['mouseover', 'touchstart'].forEach(eventType => {
            noBtn.addEventListener(eventType, (e) => {
                if (messageIndex >= messages.length) {
                    if(e.type === 'touchstart') e.preventDefault();
                    moveButton();
                }
            });
        });

        yesBtn.addEventListener('click', () => {
            askState.style.display = 'none';
            celebrateState.style.display = 'block';
            createConfetti();
        });

        function createConfetti() {
            for(let i=0; i<70; i++) {
                const confetti = document.createElement('div');
                confetti.innerText = Math.random() > 0.5 ? '❤️' : '🌸';
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-5vh';
                confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                confetti.style.animationDelay = `${Math.random() * 2}s`; 
                confetti.style.fontSize = Math.random() * 20 + 15 + 'px';
                confetti.style.zIndex = '1000';
                confetti.style.pointerEvents = 'none';
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 6000);
            }
        }
    </script>
</body>
</html>
