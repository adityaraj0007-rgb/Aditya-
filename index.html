<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ffd6ec, #e6ccff, #cceeff);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
}

/* Floating Confetti */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  background: white;
  opacity: 0.8;
  animation: float 10s linear infinite;
}

@keyframes float {
  from { transform: translateY(100vh) rotate(0deg); }
  to { transform: translateY(-10vh) rotate(720deg); }
}

h1 {
  position: absolute;
  top: 8%;
  font-size: 2rem;
  font-weight: 700;
  color: #6a0572;
  text-shadow: 2px 2px 8px rgba(0,0,0,0.1);
}

/* Gift Box */
.gift {
  font-size: 6rem;
  cursor: pointer;
  transition: transform 0.4s ease, left 0.4s ease, top 0.4s ease;
  position: absolute;
}

.wiggle {
  animation: wiggle 0.4s;
}

@keyframes wiggle {
  0% { transform: rotate(0deg); }
  25% { transform: rotate(-15deg); }
  50% { transform: rotate(15deg); }
  75% { transform: rotate(-10deg); }
  100% { transform: rotate(0deg); }
}

/* Cat Pop */
.cat {
  font-size: 5rem;
  opacity: 0;
  transform: translateY(50px);
  transition: all 0.6s ease;
}

.show-cat {
  opacity: 1;
  transform: translateY(0);
}

.message {
  margin-top: 20px;
  font-family: 'Pacifico', cursive;
  font-size: 2rem;
  color: #ff2e88;
  opacity: 0;
  transition: opacity 1s ease;
  text-shadow: 2px 2px 10px rgba(0,0,0,0.1);
}

.show-message {
  opacity: 1;
}

.sub-message {
  margin-top: 10px;
  font-size: 1.5rem;
  color: #6a0572;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}

.show-sub {
  opacity: 1;
  transform: translateY(0);
}

/* Responsive */
@media(max-width: 600px) {
  .gift { font-size: 4.5rem; }
  .cat { font-size: 4rem; }
  h1 { font-size: 1.5rem; }
  .message { font-size: 1.5rem; }
}
</style>
</head>
<body>

<h1>Click to Open Your Surprise!</h1>

<div class="gift" id="gift">🎁</div>

<div style="position:absolute; top:60%; width:100%;">
  <div class="cat" id="cat">🐱</div>
  <div class="message" id="message">
    Happy Birthday to my dearest pyari se choti se bahena 💖
  </div>
  <div class="sub-message" id="subMessage">
    Where is my party? 🥳
  </div>
</div>

<audio id="popSound" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>

<script>
const gift = document.getElementById("gift");
const cat = document.getElementById("cat");
const message = document.getElementById("message");
const subMessage = document.getElementById("subMessage");
const popSound = document.getElementById("popSound");

let attempts = 0;
const maxAttempts = 5;

function randomPosition() {
  const padding = 100;
  const x = Math.random() * (window.innerWidth - padding);
  const y = Math.random() * (window.innerHeight - padding);
  gift.style.left = x + "px";
  gift.style.top = y + "px";
}

gift.style.left = "50%";
gift.style.top = "45%";
gift.style.transform = "translate(-50%, -50%)";

gift.addEventListener("mouseover", () => {
  if (attempts < maxAttempts) {
    attempts++;
    gift.classList.add("wiggle");
    setTimeout(() => gift.classList.remove("wiggle"), 400);
    randomPosition();
  }
});

gift.addEventListener("click", () => {
  if (attempts >= maxAttempts) {
    gift.innerHTML = "🎁✨";
    popSound.play();
    gift.style.pointerEvents = "none";
    
    setTimeout(() => {
      cat.classList.add("show-cat");
      message.classList.add("show-message");
    }, 500);

    setTimeout(() => {
      subMessage.classList.add("show-sub");
    }, 2500);
  }
});

/* Generate Confetti */
for (let i = 0; i < 40; i++) {
  const conf = document.createElement("div");
  conf.classList.add("confetti");
  conf.style.left = Math.random() * 100 + "vw";
  conf.style.backgroundColor = `hsl(${Math.random()*360}, 70%, 80%)`;
  conf.style.animationDuration = (5 + Math.random() * 5) + "s";
  document.body.appendChild(conf);
}
</script>

</body>
</html>
